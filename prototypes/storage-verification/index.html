<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M05 存储验证</title></head><body><main><h1>M05 IndexedDB 存储验证工具</h1><p>这里使用真实 IndexedDB。数据只属于当前浏览器及当前网站来源；5176 与 5173 端口不同，不共享数据库。数据不会自动上传；清除网站数据可能丢失作品。这是存储验证工具，正式页面尚未接入。</p><div id="status" role="status">连接中</div><section><h2>测试作品</h2><label>名称 <input id="name" value="存储测试作品" maxlength="30"></label><button id="create">创建并完成保存</button><button id="update">修改完成版</button><button id="draft">保存编辑草稿</button><button id="restore">恢复草稿</button><button id="commit">提交草稿</button><button id="delete">删除作品</button><p id="work"></p><p id="draft-info"></p><div id="thumbnail"></div></section><section><h2>收藏测试</h2><button id="favorite">收藏测试展品</button><button id="unfavorite">取消收藏</button><p id="favorites"></p></section><section><h2>恢复信息</h2><button id="inspect">检查异常记录</button><button id="backup">下载原始备份</button><pre id="issues"></pre></section></main><script type="module" src="/src/main.ts"></script></body></html>
